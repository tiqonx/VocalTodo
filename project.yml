name: VocalTodo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  VocalTodo:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vocaltodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Vocal To-Do"
        NSMicrophoneUsageDescription: "Pour dicter tes tâches"
        NSSpeechRecognitionUsageDescription: "Pour transformer ta voix en texte"
        NSCalendarsFullAccessUsageDescription: "Pour écrire tes tâches dans ton agenda"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
